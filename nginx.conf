server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location /budget-portal/ {
        try_files $uri $uri/ /budget-portal/index.html;
    }

    location /en/ {
        try_files $uri $uri/index.html /en/index.html;
    }

    location /fil/ {
        try_files $uri $uri/index.html /fil/index.html;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
